<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#5B4CF0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="96" height="96" fill="url(#bg)" rx="20"/>

  <!-- Circular arrow (resume/restart) -->
  <g transform="translate(48, 48)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <!-- Main arc (clockwise, 300 degrees) -->
    <path d="M 0 -22 A 22 22 0 1 1 -19 11" />
    <!-- Arrow head at end of arc -->
    <path d="M -19 11 L -12 6 M -19 11 L -14 19" stroke-width="5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#fff" stroke="none"/>
  </g>
</svg>

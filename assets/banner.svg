<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#eef0f8"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#5B4CF0"/>
    </linearGradient>
    <style>
      .h1 { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .tagline { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #555; }
      .feat { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" fill="url(#bg)" rx="12"/>

  <!-- Logo -->
  <g transform="translate(30, 35)">
    <rect width="110" height="110" fill="url(#logoBg)" rx="20"/>
    <g transform="translate(55, 55)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
      <path d="M 0 -26 A 26 26 0 1 1 -22 13" />
      <path d="M -22 13 L -14 7 M -22 13 L -16 22" stroke-width="5"/>
      <circle cx="0" cy="0" r="4" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- Title + Tagline -->
  <g transform="translate(160, 50)">
    <text x="0" y="0" class="h1">dsh-autoresume</text>
    <text x="0" y="28" class="tagline">Auto-injects "continue" after a Web restart or upstream failure</text>
    <text x="0" y="48" class="tagline">when a turn is left mid-flight — no manual click.</text>
  </g>

  <!-- Feature badges -->
  <g transform="translate(160, 115)">
    <rect x="0" y="0" width="100" height="24" fill="#4D6BFE" rx="4"/>
    <text x="50" y="16" class="feat" text-anchor="middle">Auto-resume</text>
    <rect x="108" y="0" width="110" height="24" fill="#0B7285" rx="4"/>
    <text x="163" y="16" class="feat" text-anchor="middle">Dead-loop guard</text>
    <rect x="226" y="0" width="90" height="24" fill="#5B4CF0" rx="4"/>
    <text x="271" y="16" class="feat" text-anchor="middle">Queue guard</text>
    <rect x="324" y="0" width="100" height="24" fill="#E8590C" rx="4"/>
    <text x="374" y="16" class="feat" text-anchor="middle">Cross-platform</text>
  </g>
</svg>

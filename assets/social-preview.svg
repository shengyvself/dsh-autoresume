<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#eef0f8"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#5B4CF0"/>
    </linearGradient>
    <style>
      .h1 { font: 700 48px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .tagline { font: 400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #555; }
      .cmd { font: 600 18px monospace; fill: #4D6BFE; }
      .label { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #888; }
      .badge-text { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fff; }
      .meta { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #999; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo (centered) -->
  <g transform="translate(490, 80)">
    <rect width="220" height="220" fill="url(#logoBg)" rx="40"/>
    <g transform="translate(110, 110)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
      <path d="M 0 -52 A 52 52 0 1 1 -44 26" />
      <path d="M -44 26 L -28 14 M -44 26 L -32 44" stroke-width="10"/>
      <circle cx="0" cy="0" r="8" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="360" class="h1" text-anchor="middle">dsh-autoresume</text>

  <!-- Tagline -->
  <text x="600" y="400" class="tagline" text-anchor="middle">Auto-injects "continue" after a Web restart or upstream failure</text>

  <!-- Install command -->
  <g transform="translate(200, 440)">
    <rect width="800" height="50" fill="#ffffff" rx="8" stroke="#e0e0e0"/>
    <text x="20" y="32" class="cmd">dsh plugin --profile web add dsh-autoresume</text>
  </g>

  <!-- Badges -->
  <g transform="translate(240, 520)">
    <rect x="0" y="0" width="130" height="30" fill="#4D6BFE" rx="6"/>
    <text x="65" y="20" class="badge-text" text-anchor="middle">Auto-resume</text>
    <rect x="140" y="0" width="140" height="30" fill="#0B7285" rx="6"/>
    <text x="210" y="20" class="badge-text" text-anchor="middle">Dead-loop guard</text>
    <rect x="290" y="0" width="120" height="30" fill="#5B4CF0" rx="6"/>
    <text x="350" y="20" class="badge-text" text-anchor="middle">Queue guard</text>
    <rect x="420" y="0" width="140" height="30" fill="#E8590C" rx="6"/>
    <text x="490" y="20" class="badge-text" text-anchor="middle">Cross-platform</text>
    <rect x="570" y="0" width="130" height="30" fill="#65a30d" rx="6"/>
    <text x="635" y="20" class="badge-text" text-anchor="middle">Apache-2.0</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" class="meta" text-anchor="middle">DeepSeek Harness · dsh plugin · github.com/shengyvself/dsh-autoresume</text>
</svg>

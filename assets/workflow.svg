<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#eef0f8"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8590C"/>
      <stop offset="100%" stop-color="#DC4E0A"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#3B5BDE"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B4CF0"/>
      <stop offset="100%" stop-color="#4A3BDD"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B7285"/>
      <stop offset="100%" stop-color="#096273"/>
    </linearGradient>
    <linearGradient id="fail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#868E96"/>
      <stop offset="100%" stop-color="#747A80"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .box-title { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fff; }
      .box-desc { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fff; }
      .label { font: 600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">dsh-autoresume · Decision Flow</text>

  <!-- Row 1: Triggers -->
  <g transform="translate(80, 60)">
    <rect width="200" height="60" fill="url(#trigger)" rx="8"/>
    <text x="100" y="25" class="box-title" text-anchor="middle">Web restart</text>
    <text x="100" y="43" class="box-desc" text-anchor="middle">dsh web restart → scan sessions</text>
  </g>
  <g transform="translate(400, 60)">
    <rect width="200" height="60" fill="url(#trigger)" rx="8"/>
    <text x="100" y="25" class="box-title" text-anchor="middle">Upstream failure</text>
    <text x="100" y="43" class="box-desc" text-anchor="middle">429 / 5xx / ECONNRESET / 504</text>
  </g>
  <g transform="translate(720, 60)">
    <rect width="200" height="60" fill="url(#trigger)" rx="8"/>
    <text x="100" y="25" class="box-title" text-anchor="middle">Quota / billing</text>
    <text x="100" y="43" class="box-desc" text-anchor="middle">402 / QUOTA / insufficient</text>
  </g>

  <!-- Arrows from triggers to classify -->
  <line x1="180" y1="120" x2="180" y2="170" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="500" y2="170" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="120" x2="820" y2="170" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="160" x2="820" y2="160" stroke="#888" stroke-width="2"/>
  <line x1="500" y1="160" x2="500" y2="170" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Classify -->
  <g transform="translate(320, 175)">
    <rect width="360" height="55" fill="url(#check)" rx="8"/>
    <text x="180" y="24" class="box-title" text-anchor="middle">Classify error</text>
    <text x="180" y="42" class="box-desc" text-anchor="middle">transient (retry) vs permanent (skip)</text>
  </g>

  <!-- Arrow to guards -->
  <line x1="500" y1="230" x2="500" y2="260" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Guards (two parallel checks) -->
  <g transform="translate(120, 265)">
    <rect width="260" height="60" fill="url(#check)" rx="8"/>
    <text x="130" y="25" class="box-title" text-anchor="middle">Queue guard</text>
    <text x="130" y="43" class="box-desc" text-anchor="middle">inbox has user pending msg?</text>
    <text x="130" y="55" class="box-desc" text-anchor="middle" fill="#ffa">if yes → skip (no inject)</text>
  </g>
  <g transform="translate(620, 265)">
    <rect width="260" height="60" fill="url(#check)" rx="8"/>
    <text x="130" y="25" class="box-title" text-anchor="middle">Dead-loop guard</text>
    <text x="130" y="43" class="box-desc" text-anchor="middle">previous retry → no content?</text>
    <text x="130" y="55" class="box-desc" text-anchor="middle" fill="#ffa">if yes → settled (hand back)</text>
  </g>

  <!-- Arrows to inject -->
  <line x1="250" y1="325" x2="250" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="325" x2="750" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="360" x2="750" y2="360" stroke="#888" stroke-width="2"/>
  <line x1="500" y1="360" x2="500" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: Inject -->
  <g transform="translate(340, 375)">
    <rect width="320" height="55" fill="url(#action)" rx="8"/>
    <text x="160" y="24" class="box-title" text-anchor="middle">Inject "continue"</text>
    <text x="160" y="42" class="box-desc" text-anchor="middle">transient: 2-shot · quota: 1-shot</text>
  </g>

  <!-- Arrows to results -->
  <line x1="440" y1="430" x2="440" y2="460" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="430" x2="560" y2="460" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: Results -->
  <g transform="translate(260, 465)">
    <rect width="200" height="45" fill="url(#success)" rx="8"/>
    <text x="100" y="20" class="box-title" text-anchor="middle">Recovered</text>
    <text x="100" y="36" class="box-desc" text-anchor="middle">turn continues</text>
  </g>
  <g transform="translate(540, 465)">
    <rect width="200" height="45" fill="url(#fail)" rx="8"/>
    <text x="100" y="20" class="box-title" text-anchor="middle">Settled</text>
    <text x="100" y="36" class="box-desc" text-anchor="middle">control handed back</text>
  </g>

  <!-- Labels for decision branches -->
  <text x="280" y="350" class="label">pass</text>
  <text x="720" y="350" class="label">pass</text>
</svg>
